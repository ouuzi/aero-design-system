name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint (the design-system rules on the kit's own source)
        run: npm run lint -- --max-warnings=0
      - name: dist/ is built from src/ (consumers install it without building)
        run: npm run check:dist
      - name: Tests (tokens.css and tokens.json match theme.css, contrast, kit, lint rules)
        run: npm test
      - name: Design guide in step with the code
        run: npm run guide:check
      - name: Design guide builds
        run: npm run guide:build
      - name: Tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
