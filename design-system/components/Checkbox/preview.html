<!-- @dsCard group="Forms" height=260 -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>body { margin: 0; padding: 16px; background: var(--color-canvas); font-family: var(--font-sans); color: var(--color-ink); }</style>
</head>
<body>
<div id="root"></div>
<script>
var h = React.createElement, UI = window.AeroCompetenceHub;
function Preview() {
  var a = React.useState(true), b = React.useState(false);
  var d = React.useState({ line: true, base: false, shop: true });
  var all = d[0].line && d[0].base && d[0].shop, some = !all && (d[0].line || d[0].base || d[0].shop);
  function setDept(k) { return function (on) { var n = Object.assign({}, d[0]); n[k] = on; d[1](n); }; }
  return h('div', { className: 'grid max-w-[720px] grid-cols-2 gap-6' },
    h('div', { className: 'flex flex-col gap-2' },
      h(UI.Checkbox, { label: 'Does not expire', checked: a[0], onCheckedChange: a[1] }),
      h(UI.Checkbox, { label: 'Mandatory requirement', description: 'Counts towards readiness for every person in this position.', checked: b[0], onCheckedChange: b[1] }),
      h(UI.Checkbox, { label: 'All departments', checked: all, indeterminate: some, onCheckedChange: function (on) { d[1]({ line: on, base: on, shop: on }); } }),
      h(UI.Checkbox, { label: 'I have checked the evidence', error: 'Confirm the evidence before signing.', checked: false, onChange: function () {} }),
      h(UI.Checkbox, { label: 'Issued by the quality department', checked: true, disabled: true, onChange: function () {} }),
      h(UI.Checkbox, { label: 'Not applicable', disabled: true, checked: false, onChange: function () {} })),
    h(UI.CheckboxGroup, { legend: 'Relevant departments', hint: 'Choose every department this course applies to.', variant: 'card' },
      h(UI.Checkbox, { label: 'Line maintenance', checked: d[0].line, onCheckedChange: setDept('line') }),
      h(UI.Checkbox, { label: 'Base maintenance', checked: d[0].base, onCheckedChange: setDept('base') }),
      h(UI.Checkbox, { label: 'Component shop', checked: d[0].shop, onCheckedChange: setDept('shop') })));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Preview));
</script>
</body>
</html>
