<!-- @dsCard group="Forms" height=392 -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>body { margin: 0; padding: 16px; background: var(--color-canvas); font-family: var(--font-sans); color: var(--color-ink); }</style>
</head>
<body>
<div id="root"></div>
<script>
var h = React.createElement, UI = window.AeroCompetenceHub, I = UI.icons;
ReactDOM.createRoot(document.getElementById('root')).render(h(function Preview() { return h('div', { className: 'flex max-w-[640px] flex-col gap-4' },
  h('div', { className: 'grid grid-cols-2 gap-4' },
    h(UI.Field, { label: 'Employee ID', hint: 'As printed on the staff card.' }, h(UI.Input, { defaultValue: 'AES-0412' })),
    h(UI.Field, { label: 'Department' }, h(UI.Select, { defaultValue: 'b' }, h('option', { value: 'a' }, 'Line maintenance'), h('option', { value: 'b' }, 'Base maintenance'))),
    h(UI.Field, { label: 'Licence number', required: true, error: 'Enter the licence number.' }, h(UI.Input, { placeholder: 'GR.66.1234' })),
    h(UI.Field, { label: 'Category' }, h(UI.Select, { disabled: true }, h('option', null, 'B1.1 (calculated)'))),
    h(UI.Field, { label: 'Remarks', className: 'col-span-2' }, h(UI.Textarea, { rows: 2, placeholder: 'Optional' }))),
  h('div', { className: 'flex flex-wrap items-center gap-3' },
    h('div', { className: 'w-40' }, h(UI.Input, { size: 'lg', 'aria-label': 'Size lg', defaultValue: 'lg 40px' })),
    h('div', { className: 'w-40' }, h(UI.Input, { size: 'md', 'aria-label': 'Size md', defaultValue: 'md 36px' })),
    h(UI.Button, { icon: I.Search }, 'Search'),
    h('div', { className: 'w-36' }, h(UI.Select, { size: 'sm', 'aria-label': 'Size sm', defaultValue: 's' }, h('option', { value: 's' }, 'sm 32px'))))
); }));
</script>
</body>
</html>
