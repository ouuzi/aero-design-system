<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>body { margin: 0; padding: 16px; background: var(--color-canvas); font-family: var(--font-sans); color: var(--color-ink); }</style>
</head>
<body>
<div id="root"></div>
<script>
var h = React.createElement, UI = window.AeroCompetenceHub, I = UI.icons;
function Preview() {
  var s = React.useState(['A320', 'A330', 'B737-800']), list = s[0], set = s[1];
  var t = React.useState(['ATA 27', 'ATA 32']), ata = t[0], setAta = t[1];
  return h('div', { className: 'flex flex-col gap-3' },
    h('div', { className: 'flex flex-wrap items-center gap-1.5' },
      list.map(function (v) { return h(UI.Chip, { key: v, tone: 'brand', icon: I.CheckCircle2, onRemove: function () { set(list.filter(function (x) { return x !== v; })); } }, v); }),
      h(UI.StatusBadge, { tone: 'warning', onRemove: function () {}, removeLabel: 'Remove ATR 72' }, 'ATR 72 not in register')),
    h('div', { className: 'flex flex-wrap items-center gap-1.5' },
      ata.map(function (v) { return h(UI.Chip, { key: v, onRemove: function () { setAta(ata.filter(function (x) { return x !== v; })); } }, v); }),
      h(UI.Chip, { tone: 'info' }, 'Read only'),
      h(UI.Chip, { tone: 'violet' }, 'Internal')));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Preview));
</script>
</body>
</html>
